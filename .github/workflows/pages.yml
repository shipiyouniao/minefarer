name: Check and deploy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm audit
      - run: npm run check
      - run: node scripts/verify-build.mjs

      - name: Verify development asset paths
        run: |
          npx vite build --base=/minefarer/dev/
          BUILD_BASE_PATH=/minefarer/dev/ node scripts/verify-build.mjs

  package:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            stable/package-lock.json
            development/package-lock.json
      - name: Validate and build resolved stable revision
        working-directory: stable
        run: |
          npm ci --no-audit
          npm audit
          npm run check
          npm run test:legacy
          node scripts/verify-build.mjs
      - name: Validate and build resolved development revision
        working-directory: development
        run: |
          npm ci --no-audit
          npm audit
          npm run check
          npm run test:legacy
          npx vite build --base=/minefarer/dev/
          BUILD_BASE_PATH=/minefarer/dev/ node scripts/verify-build.mjs
      - name: Assemble both sites
        run: |
          mkdir -p site/dev
          cp -a stable/dist/. site/
          cp -a development/dist/. site/dev/
          test -f site/index.html
          test -f site/dev/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy stable and development together
        id: deployment
        uses: actions/deploy-pages@v4
